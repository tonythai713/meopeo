<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MeoPeo</title>
  <meta name="theme-color" content="#0e1230">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeoPeo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"><div class="mp-loading">🌙 Loading…</div></main>
  <div id="toasts" aria-live="polite"></div>
  <script type="module">
    import { createBackend } from "./data.js";
    import { start } from "./app.js";
    start(createBackend()).catch((err) => { document.getElementById("app").textContent = "MeoPeo couldn't start: " + err.message; });
  </script>
</body>
</html>
